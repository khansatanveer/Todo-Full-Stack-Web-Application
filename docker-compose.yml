version: '3.8'

services:
  # Local PostgreSQL for development (optional - can also use Neon directly)
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    profiles:
      - local-db  # Only start when explicitly needed

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Use Neon PostgreSQL (production) by default
      # For local development, uncomment db service and change DATABASE_URL
      DATABASE_URL: postgresql://neondb_owner:npg_Fyh73cvSPZgJ@ep-restless-forest-ah925lio-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require
      SECRET_KEY: 4f3c8a9b2e6d7f8c1a0b9d4e3f2c1a8d6e7f9c2a1b4d6e8f0a1b2c3d4e5f6a7
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BETTER_AUTH_SECRET: WaTM87GZKwu8KEHB0M8X9ZHN3rg9OjCC
    depends_on:
      - db
    profiles:
      - local-db  # Only start with local-db profile
    # If you want to enable live reloading for development, uncomment the following:
    # volumes:
    #   - ./backend:/app
    # command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend service
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    profiles:
      - local-db

volumes:
  db-data: